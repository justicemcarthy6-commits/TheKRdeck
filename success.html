<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Sent - TheKRdeck</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simplified Navigation for the Success Page -->
    <nav class="top-navbar" role="navigation">
        <a href="index.html" class="nav-logo">
            <img src="assets/logo.png" alt="TheKRdeck Logo" class="logo-img">
        </a>
    </nav>

    <!-- Success Confirmation Section -->
    <main class="section-container fade-in" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center;" role="main">
        
        <!-- Interactive Mascot Confirmation -->
        <div style="margin-bottom: 20px;">
            <img src="assets/mansa-mascot.png" alt="Mansa mascot confirming success" style="width: 150px; height: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));">
        </div>

        <h1 style="color: #0d1b3e; margin-bottom: 15px; font-size: 2.5rem;">Proposal <span class="gold-highlight">Received!</span></h1>
        
        <p style="color: #444; max-width: 500px; margin-bottom: 30px; font-size: 1.1rem; line-height: 1.6;">
            Thank you for reaching out! Your project idea has been successfully submitted. We will review your message and get back to you shortly.
        </p>

        <a href="index.html" class="btn-gold" style="text-decoration: none; padding: 12px 30px; font-weight: 700; border-radius: 6px; color: #0d1b3e; display: inline-block;">
            ← Return to Homepage
        </a>
        
    </main>

    <!-- Global Scripts -->
    <script src="main.js"></script>
</body>
</html>
